name: Publicar portafolio en GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Obtener el código
        uses: actions/checkout@v7
      - name: Preparar Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Validar la configuración de publicación
        run: npm run check:deploy
      # withastro/action instala antes de ejecutar build-cmd. Restauramos el
      # lockfile original y usamos npm ci para que el build sea reproducible.
      - name: Comprobar, compilar y preparar el artefacto estático
        uses: withastro/action@v6
        with:
          node-version: '24'
          build-cmd: git restore -- package-lock.json && npm ci && npm run check && npm run build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v5
